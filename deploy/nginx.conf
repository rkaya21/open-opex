server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    # Django API + admin
    location ~ ^/(api|admin)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;  # tenant is resolved from this
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Collected Django static files (admin, DRF)
    location /static/ {
        alias /srv/static/;
        expires 30d;
    }

    # Uploaded media (finding photos)
    location /media/ {
        alias /srv/media/;
        expires 7d;
    }

    # Everything else → Next.js
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
