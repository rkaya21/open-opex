[project]
name = "open-opex-backend"
version = "0.1.0"
description = "open-opex backend — Django API for the Operational Excellence platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.1,<5.2",
    "django-tenants>=3.7",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt[crypto]>=5.4",
    "drf-spectacular>=0.28",
    "django-cors-headers>=4.6",
    "celery[redis]>=5.4",
    "psycopg[binary]>=3.2",
    "gunicorn>=23.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["I001", "E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "--cov=apps --cov-report=term-missing"

[tool.coverage.run]
omit = ["*/migrations/*", "*/tests/*"]
